name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read # Required to check out and verify the release contents.

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Check version consistency
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | tr -d '\r')
          CHANGELOG_VERSION=$(grep -m 1 '## \[' CHANGELOG.md | sed 's/.*\[\(.*\)\].*/\1/' | tr -d '\r')
          echo "pubspec.yaml: $PUBSPEC_VERSION"
          echo "CHANGELOG.md: $CHANGELOG_VERSION"
          if [ "$PUBSPEC_VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "Version mismatch: pubspec.yaml=$PUBSPEC_VERSION CHANGELOG.md=$CHANGELOG_VERSION"
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: dart analyze --fatal-infos

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Scan the current tree for secrets
        run: gitleaks dir --redact --no-banner --exit-code 1 .

      - name: Run Dart Decimate
        run: npx --yes dart-decimate@latest json .

      - name: Publish dry run
        run: dart pub publish --dry-run

      - name: Checkout Flutter skill docs
        run: git clone --depth 1 --branch main https://github.com/sgaabdu4/building-flutter-apps.git ../building-flutter-apps

      - name: Run tests
        run: dart test --reporter expanded

      - name: Run real analyzer-server smoke
        run: RUN_FLUTTER_PLUGIN_SMOKE=1 dart test test/integration_plugin_smoke_test.dart --reporter expanded

  publish:
    name: Publish to pub.dev
    needs: verify
    permissions:
      id-token: write # Required for pub.dev trusted publishing.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub release.
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
            exit 0
          fi

          gh release create "$TAG_NAME" --verify-tag --generate-notes --latest
