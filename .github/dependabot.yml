version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      # Analyzer 13 changes AST APIs used by this plugin. Stay on analyzer 12
      # until riverpod_lint and the plugin implementation can move together.
      - dependency-name: analyzer
        update-types:
          - version-update:semver-major
