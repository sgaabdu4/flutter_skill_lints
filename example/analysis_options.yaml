include: package:flutter_lints/flutter.yaml

plugins:
  flutter_skill_lints:
    version: ^0.1.0
  riverpod_lint: 3.1.4-dev.3

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    - "**/*.arb"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore

formatter:
  page_width: 100

linter:
  rules:
    - avoid_dynamic_calls
    - avoid_print
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - unawaited_futures
